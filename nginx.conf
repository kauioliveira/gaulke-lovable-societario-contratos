server {
    listen 80;
    server_name _;

    location /assets/ {
        alias /app/.output/public/assets/;
        access_log off;
        expires 1m;
        add_header Cache-Control "public, max-age=60";
        try_files $uri =404;

        # O mime.types padrao do Alpine nao mapeia .mjs; sem isto o worker do
        # pdfjs (pdf.worker-*.mjs) sai como octet-stream e o navegador recusa
        # o modulo ("Failed to fetch dynamically imported module").
        types {
            text/javascript js mjs;
            text/css css;
            font/woff woff;
            font/woff2 woff2;
            image/png png;
            image/svg+xml svg;
            application/json json;
        }
    }

    location /_build/ {
        alias /app/.output/public/_build/;
        access_log off;
        expires 1m;
        add_header Cache-Control "public, max-age=60";
        try_files $uri =404;

        types {
            text/javascript js mjs;
            text/css css;
            font/woff woff;
            font/woff2 woff2;
            image/png png;
            image/svg+xml svg;
            application/json json;
        }
    }

    location /favicon.ico {
        try_files /app/.output/public/favicon.ico =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
